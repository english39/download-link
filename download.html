<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Learn English</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .container{
      background:rgba(255,255,255,0.95); border-radius:30px; padding:60px 40px; max-width:600px; width:100%;
      box-shadow:0 20px 60px rgba(0,0,0,0.3); text-align:center; animation:fadeIn .8s ease-out;
    }
    @keyframes fadeIn { from{opacity:0; transform:translateY(30px)} to{opacity:1; transform:translateY(0)} }
    .app-icon{
      width:120px; height:120px; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      border-radius:25px; margin:0 auto 30px; display:flex; align-items:center; justify-content:center; font-size:60px;
      box-shadow:0 10px 30px rgba(102,126,234,0.4); animation:bounce 2s infinite; color:#fff;
    }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    h1{ color:#2d3748; font-size:2.5em; margin-bottom:15px; font-weight:700; }
    .subtitle{ color:#718096; font-size:1.2em; margin-bottom:40px; line-height:1.6; }
    .download-section{ display:flex; flex-direction:column; gap:20px; margin-top:40px; }
    .download-btn{
      display:flex; align-items:center; justify-content:center; gap:14px; background:white; color:#2d3748;
      padding:18px 24px; border-radius:16px; text-decoration:none; font-size:1.05em; font-weight:600;
      transition:all .3s ease; box-shadow:0 5px 15px rgba(0,0,0,.1); border:2px solid #e2e8f0;
    }
    .download-btn:hover{ transform:translateY(-5px); box-shadow:0 10px 25px rgba(0,0,0,.15); border-color:#667eea; }
    .download-btn.android{ background:linear-gradient(135deg,#34a853 0%,#2d8e47 100%); color:#fff; border:none; }
    .download-btn.ios{ background:linear-gradient(135deg,#000 0%,#434343 100%); color:#fff; border:none; }
    .btn-icon{ display:flex; align-items:center; justify-content:center; }
    .btn-icon svg{ width:28px; height:28px; display:block; }
    .btn-text{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.1; }
    .btn-small{ font-size:.75em; font-weight:400; opacity:.9; }
    .btn-large{ font-size:1.1em; font-weight:700; }
    .features{ display:flex; justify-content:space-around; margin-top:50px; flex-wrap:wrap; gap:20px; }
    .feature{ flex:1; min-width:150px; }
    .feature-icon{ font-size:2.5em; margin-bottom:10px; }
    .feature-text{ color:#4a5568; font-size:.95em; font-weight:600; }

    @media (max-width:600px){
      .container{ padding:40px 25px; }
      h1{ font-size:2em; }
      .subtitle{ font-size:1em; }
      .download-btn{ padding:16px 20px; font-size:1em; }
      .btn-icon svg{ width:24px; height:24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-icon">📚</div>

    <h1>Learn English Words</h1>
    <div class="download-section">
      <!-- Google Play -->
      <a href="https://play.google.com/store/apps/details?id=com.arliadem.english&pcampaignid=web_share"
         class="download-btn android" target="_blank" rel="noopener">
        <span class="btn-icon" aria-hidden="true">
          <!-- Google Play triangle (gradient) -->
          <svg viewBox="0 0 512 512" role="img" aria-label="Google Play">
            <defs>
              <linearGradient id="gp-a" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00C3FF"/>
                <stop offset="50%" stop-color="#3BEA62"/>
                <stop offset="100%" stop-color="#FFC400"/>
              </linearGradient>
            </defs>
            <path fill="url(#gp-a)"
              d="M52.5 69.7C52.5 58.5 64.6 51 74 56.6l269.8 155.8c14 8.1 14 28.4 0 36.5L74 404.7c-9.4 5.5-21.5-1.9-21.5-13.1V69.7z"/>
            <path fill="#FF3A44" opacity=".9"
              d="M354.6 224.5 288.2 187 86 69.2c-4.3-2.5-8.8-3.4-13.5-2.6l282.1 163.6z"/>
            <path fill="#00D2FF" opacity=".9"
              d="M354.6 287.5 72.5 451.1c4.7.8 9.2-.1 13.5-2.6l202.2-117.8 66.4-37.5z"/>
            <path fill="#0066FF" opacity=".15"
              d="M354.6 224.5v63l109.4 61.8c15.1 8.5 33.9-2.5 33.9-19.6V182.3c0-17.1-18.8-28.1-33.9-19.6L354.6 224.5z"/>
          </svg>
        </span>
        <div class="btn-text">
          <span class="btn-small">GET IT ON</span>
          <span class="btn-large">Google Play</span>
        </div>
      </a>

      <!-- App Store -->
      <a href="https://apps.apple.com/tr/app/i-ngilizce-kelimelerim/id6742754298?l=tr"
         class="download-btn ios" target="_blank" rel="noopener">
        <span class="btn-icon" aria-hidden="true">
          <!-- Apple logo -->
          <svg viewBox="0 0 384 512" role="img" aria-label="App Store">
            <path fill="#ffffff"
              d="M318.7 268.3c-.6-64 52.2-94.5 54.6-95.9-29.7-43.4-75.9-49.3-92.3-50-39.3-4-76.6 23.2-96.5 23.2-19.8 0-50.8-22.6-83.5-21.9-42.9.6-82.6 24.9-104.8 63.1-44.6 77.2-11.4 191.2 32 253.7 21.2 30.8 46.4 65.3 79.8 64 32-1.3 44.1-20.7 82.7-20.7s49.6 20.7 83.7 20.1c34.7-.5 56.7-31.5 77.8-62.4 24.5-35.7 34.6-70.2 35.2-71.9-.8-.3-67.7-26-68.7-101.3zM259.9 99.8c17.5-21.3 29.3-50.9 26.1-80.4-25.3 1-56 16.8-74.4 38-16.4 18.9-30.6 49.1-26.8 77.8 28.4 2.2 57.6-14.4 75.1-35.4z"/>
          </svg>
        </span>
        <div class="btn-text">
          <span class="btn-small">Download on the</span>
          <span class="btn-large">App Store</span>
        </div>
      </a>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">⚡</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🎯</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🏆</div>
      </div>
    </div>
  </div>
</body>
</html>
